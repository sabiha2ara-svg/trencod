# For a NEW Blueprint only. Existing service: keep its current settings and add DATABASE_URL.
services:
  - type: web
    name: trencod
    runtime: python
    plan: free
    region: singapore
    rootDir: trencod-app
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --no-browser
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRENCOD_HOST
        value: 0.0.0.0
